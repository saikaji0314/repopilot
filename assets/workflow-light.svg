<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="346" viewBox="0 0 1120 346" role="img" aria-labelledby="title desc">
<title id="title">RepoPilot 研发交付工作流</title>
<desc id="desc">蓝色为从需求到交付的主干流程，紫色为负责人审批。灰色支路表示审核返工、主线更新和冲突修复。更新后的代码重新检查和双审，并再次取得负责人对新版本的批准。GitLab交付到草稿MR；后续原生Approve及自动合并为GitHub可选能力。</desc>
<defs>
 <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563c5"/></marker>
 <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8798ad"/></marker>
</defs>
<style>text{font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif}.label{font-size:18px;font-weight:650;fill:#182537}.sub{font-size:13px;fill:#607086}.small{font-size:12px;fill:#607086}.branch{fill:none;stroke:#8798ad;stroke-width:1.5;stroke-dasharray:4 4;stroke-linejoin:round;marker-end:url(#gray)}</style>
<rect x="1" y="1" width="1118" height="344" rx="18" fill="#ffffff" stroke="#d8e1ec"/>
<rect x="26" y="28" width="485" height="48" rx="10" fill="#f6f8fb" stroke="#d8e1ec"/>
<text x="44" y="57" fill="#182537" font-size="14" font-weight="650">上下文输入</text>
<text x="137" y="57" class="sub">需求澄清 · 项目资料 · 仓库事实</text>
<path d="M289 77V107" class="branch"/>
<rect x="541" y="28" width="215" height="48" rx="10" fill="#f6f8fb" stroke="#d8e1ec"/>
<text x="648" y="48" text-anchor="middle" fill="#182537" font-size="14" font-weight="650">按需争议复核</text>
<text x="648" y="65" text-anchor="middle" class="small">分歧触发 · A / B + C</text>
<path d="M467 109V87H594V78" class="branch"/>
<path d="M700 77V96H500V108" class="branch"/>
<line x1="789" y1="45" x2="815" y2="45" stroke="#2563c5" stroke-width="3"/>
<text x="824" y="50" class="small">主干流程</text>
<rect x="928" y="38" width="13" height="13" rx="3" fill="#f6f1ff" stroke="#7954b3"/>
<text x="951" y="50" class="small">负责人决策</text>
<rect x="731" y="92" width="367" height="132" rx="13" fill="none" stroke="#cfb9ed" stroke-dasharray="4 5"/>
<rect x="851" y="83" width="132" height="18" rx="5" fill="#ffffff"/>
<text x="917" y="97" text-anchor="middle" font-size="12" fill="#7954b3">GitHub 可选合并</text>
<rect x="26" y="110" width="170" height="102" rx="11" fill="#eff6ff" stroke="#b2ccef"/>
<text x="40" y="132" font-size="11" font-weight="650" fill="#2563c5">01 / INPUT</text>
<text x="111" y="157" text-anchor="middle" class="label">需求接入</text>
<text x="111" y="180" text-anchor="middle" class="sub">Issue / 本地需求</text>
<text x="111" y="199" text-anchor="middle" class="small">接入任务</text>
<path d="M197 161H203" fill="none" stroke="#2563c5" stroke-width="2.2" marker-end="url(#blue)"/>
<rect x="204" y="110" width="170" height="102" rx="11" fill="#eff6ff" stroke="#b2ccef"/>
<text x="218" y="132" font-size="11" font-weight="650" fill="#2563c5">02 / AGENT</text>
<text x="289" y="157" text-anchor="middle" class="label">规划与实现</text>
<text x="289" y="180" text-anchor="middle" class="sub">独立工作区 · 子任务</text>
<text x="289" y="199" text-anchor="middle" class="small">生成候选</text>
<path d="M375 161H381" fill="none" stroke="#2563c5" stroke-width="2.2" marker-end="url(#blue)"/>
<rect x="382" y="110" width="170" height="102" rx="11" fill="#eff6ff" stroke="#b2ccef"/>
<text x="396" y="132" font-size="11" font-weight="650" fill="#2563c5">03 / VALIDATE</text>
<text x="467" y="157" text-anchor="middle" class="label">检查与审核</text>
<text x="467" y="180" text-anchor="middle" class="sub">独立检查 · 双视角审核</text>
<text x="467" y="199" text-anchor="middle" class="small">审核返工有界</text>
<path d="M553 161H559" fill="none" stroke="#2563c5" stroke-width="2.2" marker-end="url(#blue)"/>
<rect x="560" y="110" width="170" height="102" rx="11" fill="#f6f1ff" stroke="#cfb9ed"/>
<text x="574" y="132" font-size="11" font-weight="650" fill="#7954b3">04 / HUMAN</text>
<text x="645" y="157" text-anchor="middle" class="label">草稿交付</text>
<text x="645" y="180" text-anchor="middle" class="sub">批准 SHA · 创建 PR / MR</text>
<text x="645" y="199" text-anchor="middle" class="small">人工批准后交付</text>
<path d="M731 161H737" fill="none" stroke="#2563c5" stroke-width="2.2" marker-end="url(#blue)"/>
<rect x="738" y="110" width="170" height="102" rx="11" fill="#f6f1ff" stroke="#cfb9ed"/>
<text x="752" y="132" font-size="11" font-weight="650" fill="#7954b3">05 / HUMAN</text>
<text x="823" y="157" text-anchor="middle" class="label">GitHub Approve</text>
<text x="823" y="180" text-anchor="middle" class="sub">负责人批准当前版本</text>
<text x="823" y="199" text-anchor="middle" class="small">代码更新须重新批准</text>
<path d="M909 161H915" fill="none" stroke="#2563c5" stroke-width="2.2" marker-end="url(#blue)"/>
<rect x="916" y="110" width="170" height="102" rx="11" fill="#eff6ff" stroke="#b2ccef"/>
<text x="930" y="132" font-size="11" font-weight="650" fill="#2563c5">06 / CONTROL</text>
<text x="1001" y="157" text-anchor="middle" class="label">合并确认</text>
<text x="1001" y="180" text-anchor="middle" class="sub">核对 CI、保护与结果</text>
<text x="1001" y="199" text-anchor="middle" class="small">确认目标主线</text>
<path d="M467 213V249H289V215" class="branch"/>
<rect x="318" y="237" width="120" height="23" rx="6" fill="#ffffff"/>
<text x="378" y="253" text-anchor="middle" class="sub">返工 · 重新检查</text>
<rect x="560" y="250" width="532" height="53" rx="10" fill="#f6f8fb" stroke="#d8e1ec"/>
<text x="580" y="273" fill="#182537" font-size="14" font-weight="650">主线更新 / 冲突处理</text>
<text x="580" y="292" class="sub">更新基线 → 修复冲突 → 独立检查与双审</text>
<path d="M1001 213V247" class="branch"/>
<path d="M823 249V215" class="branch"/>
<text x="826" y="324" text-anchor="middle" class="small">版本变化后，旧批准失效；新提交需再次 Approve</text>
<rect x="26" y="290" width="485" height="35" rx="8" fill="#f6f8fb"/>
<text x="43" y="312" font-size="12" fill="#607086">执行保障：工作区隔离 · 累计额度 · 检查点与恢复</text>
</svg>
