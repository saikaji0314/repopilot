schema_version: "1.0"
id: flask-session-path-010
title: 子路径应用的 Session Cookie 忽略应用根路径
task_type: bug_diagnosis
language: zh-CN
repository:
  name: pallets-flask
  version: "3.1.3"
  baseline_path: target-repos/flask-3.1.3
  runtime: flask-source
  workspace: runtime-provided
workspace_additions:
  - source: regression_test.py
    destination: tests/test_task_regression.py
    visibility: agent_visible
user_request: |
  应用配置 APPLICATION_ROOT=/portal，未显式设置 SESSION_COOKIE_PATH。
  请求修改 session 后，响应 Set-Cookie 的 Path 却是 /，期望继承 /portal；清空 session 的删除 cookie 也必须使用同样路径规则。
  显式指定 SESSION_COOKIE_PATH=/custom 时行为正常，默认根路径应用也正常。
  请定位根因，关联配置和响应保存链路，提出最小修复及验证方案。
initial_evidence:
  command: python -m pytest tests/test_task_regression.py -q -p no:cacheprovider
  summary: 1 failed, 3 passed
  failures:
    - test: tests/test_task_regression.py::test_cookie_path_precedence_for_set_and_clear
      expected: 未显式指定 cookie 路径时，设置和删除均使用 /portal
      observed: 子路径应用响应中的 cookie Path 为 /
constraints:
  mode: read_only
  max_steps: 10
  timeout_seconds: 120
  allowed_tools: [list_files, search_code, search_symbols, read_file, run_test]
  forbidden_actions: [write_file, install_dependency, network_access]
required_output:
  format: structured_object
  fields:
    status: 取值为 diagnosed 或 insufficient_evidence
    summary: 简洁的诊断结论
    root_cause: 根因及因果解释
    evidence: 由 source 和 observation 组成的证据列表
    proposed_fix: 最小修复步骤列表
    verification: 确定性验证步骤列表
    risks: 边界、风险或未经验证的假设列表
