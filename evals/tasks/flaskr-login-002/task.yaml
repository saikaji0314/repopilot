schema_version: "1.0"
id: flaskr-login-002
title: 正确账号无法登录
task_type: bug_diagnosis
language: zh-CN

repository:
  name: flaskr-tutorial
  version: "3.1.3"
  baseline_path: target-repos/flaskr-tutorial
  workspace: runtime-provided

user_request: |
  数据库中的测试用户可以正常查询到，但使用正确用户名 test 和密码 test 登录时，
  页面仍提示密码错误，且没有跳转到首页。错误密码仍然会被拒绝。
  请定位根因，给出代码和测试证据、最小修复计划及验证方式。

initial_evidence:
  command: python -m pytest tests/test_auth.py -q -p no:cacheprovider
  summary: 1 failed, 7 passed
  failures:
    - test: tests/test_auth.py::test_login
      observed: 使用正确凭据登录后，响应中没有 Location 头
      expected: 成功登录应重定向到 /

constraints:
  mode: read_only
  max_steps: 10
  timeout_seconds: 120
  allowed_tools: [list_files, search_code, search_symbols, read_file, run_test]
  forbidden_actions: [write_file, install_dependency, network_access]

required_output:
  format: structured_object
  fields:
    status: 取值为 diagnosed 或 insufficient_evidence
    summary: 简洁的诊断结论
    root_cause: 根因及因果解释
    evidence: 由 source 和 observation 组成的证据列表
    proposed_fix: 最小修复步骤列表
    verification: 确定性验证步骤列表
    risks: 边界、风险或未经验证的假设列表
