schema_version: "1.0"
id: flaskr-transaction-005
title: 更新文章后数据没有保存
task_type: bug_diagnosis
language: zh-CN

repository:
  name: flaskr-tutorial
  version: "3.1.3"
  baseline_path: target-repos/flaskr-tutorial
  workspace: runtime-provided

user_request: |
  用户提交文章修改后收到了正常重定向，没有错误提示；但重新打开文章时仍是旧标题。
  创建和删除文章功能正常。请定位根因，给出证据、最小修复计划和验证方式。

initial_evidence:
  command: python -m pytest tests/test_blog.py::test_update -q -p no:cacheprovider
  summary: 1 failed
  failures:
    - test: tests/test_blog.py::test_update
      observed: 数据库中的标题仍为 test title
      expected: 数据库中的标题应更新为 updated

constraints:
  mode: read_only
  max_steps: 10
  timeout_seconds: 120
  allowed_tools: [list_files, search_code, search_symbols, read_file, run_test]
  forbidden_actions: [write_file, install_dependency, network_access]

required_output:
  format: structured_object
  fields:
    status: 取值为 diagnosed 或 insufficient_evidence
    summary: 简洁的诊断结论
    root_cause: 根因及因果解释
    evidence: 由 source 和 observation 组成的证据列表
    proposed_fix: 最小修复步骤列表
    verification: 确定性验证步骤列表
    risks: 边界、风险或未经验证的假设列表
