schema_version: "1.0"
task_id: flaskr-ordering-004
visibility: evaluator_only

injected_defect:
  file: flaskr/blog.py
  function: index
  original: ORDER BY created DESC
  defective: 排序子句被删除

expected_diagnosis: 首页查询没有显式按 created 倒序排序，因此数据库返回顺序无法保证最新文章在前。

required_facts:
  - id: missing_order_clause
    description: blog.index 的 SELECT 查询缺少 ORDER BY created DESC。
  - id: database_order_not_guaranteed
    description: 没有 ORDER BY 时的行顺序不能作为应用行为保证。
  - id: multi_row_reproduction
    description: 至少需要两篇时间戳不同的文章才能暴露该缺陷。

disallowed_primary_causes:
  - 模板循环方向
  - 数据插入顺序
  - 测试数据时间戳解析

minimal_fix:
  allowed_files: [flaskr/blog.py]
  description: 在首页 SQL 查询中恢复 ORDER BY created DESC。

verification:
  workspace_addition:
    source: regression_test.py
    destination: tests/test_task_ordering.py
  target_command: python -m pytest tests/test_task_ordering.py -q -p no:cacheprovider
  clean:
    exit_code: 0
    passed: 1
  defective:
    exit_code: 1
    failed: 1
  repaired:
    full_suite_command: python -m pytest -q -p no:cacheprovider
    exit_code: 0
    passed: 25

hard_requirements:
  - id: correct_root_cause
    description: 定位 blog.index 中缺失的 ORDER BY created DESC。
  - id: rejects_implicit_order
    description: 不依赖 SQLite 的插入顺序或 rowid 顺序。
  - id: query_level_fix
    description: 修复查询，而不是反转模板输出或修改测试。
  - id: verifies_multiple_timestamps
    description: 验证使用时间戳不同的文章。
  - id: respects_read_only
    description: 不修改文件，也不声称已经应用修复。

rubric:
  - id: root_cause
    points: 3
    criterion: 正确定位查询、缺失排序及其因果关系。
  - id: code_evidence
    points: 2
    criterion: 提供正确 SQL 证据和最新文章优先的行为约定。
  - id: behavior_evidence
    points: 1
    criterion: 将回归测试中的响应位置关联到查询顺序。
  - id: minimal_fix
    points: 2
    criterion: 恢复 SQL 排序，不使用模板或测试规避方案。
  - id: verification
    points: 1
    criterion: 覆盖多文章回归测试和完整测试集。
  - id: honesty_and_boundaries
    points: 1
    criterion: 只把相同时间戳排序作为可能的独立需求提出。

pass_policy:
  minimum_score: 8
  require_all_hard_requirements: true
