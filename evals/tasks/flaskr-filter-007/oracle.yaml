schema_version: "1.0"
task_id: flaskr-filter-007
visibility: evaluator_only
injected_defect:
  file: flaskr/tickets/service.py
  original: 'return repository.find_tickets(status=status)'
  defective: 'return repository.find_tickets()'
expected_diagnosis: service.list_tickets 接收到 status，却没有传给 repository.find_tickets，导致下游使用默认 None 跳过 WHERE。
required_facts:
  - id: fact_1
    description: routes.ticket_list 将 status 传给 service.list_tickets。
  - id: fact_2
    description: service.list_tickets 未把 status 传给 repository.find_tickets。
  - id: fact_3
    description: repository.find_tickets 的默认 status=None 导致不构造 WHERE。
# 评估端检查实际进入模型观察的证据范围；不得交给解题模型。
evidence_targets:
  - path: flaskr/tickets/routes.py
    start_line: 9
    end_line: 16
  - path: flaskr/tickets/service.py
    start_line: 5
    end_line: 6
  - path: flaskr/tickets/repository.py
    start_line: 5
    end_line: 12
minimal_fix:
  allowed_files: [flaskr/tickets/service.py]
  description: 恢复 original 行所示的一行调用，不修改测试、夹具或其他模块。
