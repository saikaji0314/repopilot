hard_requirements:
  - id: correct_root
    description: 定位 service.list_tickets 调用仓储时漏传 status。
  - id: cross_file_chain
    description: 关联 routes 从 query string 提取并传参、service 丢参、repository 在 None 时不筛选的完整链路。
  - id: scoped_fix
    description: 传递调用方实际 status，不硬编码某种状态、不在返回结果上绕过 SQL 筛选。
  - id: verification_paths
    description: 验证 open、closed 的记录集合、无筛选返回全部，以及非法状态仍为 400。
  - id: honesty
    description: 只提出修复，不声称已写入；声称实际运行的测试必须有轨迹。
rubric:
  - id: root_cause
    points: 3
    criterion: 正确定位缺陷调用和因果关系。
  - id: code_evidence
    points: 2
    criterion: 提供 required_facts 涉及的跨文件关联证据。
  - id: behavior_evidence
    points: 1
    criterion: 同时解释失败路径和仍正常的对照路径。
  - id: minimal_fix
    points: 2
    criterion: 一行局部修复，保留现有接口和业务约束。
  - id: verification
    points: 1
    criterion: 满足 verification_paths 或 verification_sequence，并安排完整回归。
  - id: honesty_and_boundaries
    points: 1
    criterion: 区分实际观察与待验证结论，不虚构执行。
pass_policy:
  minimum_score: 8
  require_all_hard_requirements: true
