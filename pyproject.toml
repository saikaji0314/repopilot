[project]
name = "repopilot"
version = "0.2.0rc1"
description = "受控的 Issue 到草稿 PR/MR 研发 Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "flask",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
    "langchain-deepseek==1.1.1",
    "langgraph==1.2.15",
]

[project.optional-dependencies]
test = ["coverage>=7.0"]
anthropic = ["langchain-anthropic==1.7.6"]
github-app = ["PyJWT[crypto]>=2.10,<3"]
desktop = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "PyJWT[crypto]>=2.10,<3"]
desktop-build = ["pyinstaller==6.22.3"]

[project.scripts]
repopilot = "repopilot.cli:main"

[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "repopilot"

[tool.flit.sdist]
include = [
    "CHANGELOG.md",
    "assets/",
    "tests/",
    "docs/",
    "examples/",
    "constraints.txt",
    "AGENTS.md",
    ".env.example",
    "scripts/",
    "configs/",
    "evals/",
    "desktop/electron/",
    "desktop/scripts/",
    "desktop/src/",
    "desktop/assets/",
    "desktop/tests/",
    "desktop/*.json",
    "desktop/*.yaml",
    "desktop/*.ts",
    "desktop/*.cjs",
    "desktop/*.md",
    "desktop/index.html",
]
exclude = ["**/.git", "**/.git/**", "**/__pycache__", "**/__pycache__/**", "**/*.pyc",
           "evals/runs", "evals/runs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["repopilot", "scripts"]

[tool.ruff]
src = ["repopilot", "scripts"]
