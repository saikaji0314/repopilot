[project]
name = "repopilot"
version = "1.0.0"
description = "通用仓库任务调查与受控验证 Agent"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "flask",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
    "langchain-deepseek==1.1.1",
    "langgraph==1.2.15",
]

[project.optional-dependencies]
test = ["coverage>=7.0"]

[project.scripts]
run-baseline = "repopilot.legacy.baseline:main"
repopilot = "repopilot.cli:main"

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "repopilot"

[tool.flit.sdist]
include = [
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["repopilot", "scripts"]

[tool.ruff]
src = ["repopilot", "scripts"]
