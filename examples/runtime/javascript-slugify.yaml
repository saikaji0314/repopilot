schema_version: "2.0"
id: javascript-slugify
repository: fixtures/javascript
request: |
  slug.mjs 的 slugify 目前只处理了空白与下划线，仍有未完成的行为，请补齐。
  最终行为：
  1. 去掉首尾空白；
  2. 转小写；
  3. 把任意长度的空白、连字符与下划线序列替换为单个连字符；
  4. 去掉结果开头和结尾多余的连字符。
  也就是说 "_Hello  World_"、"---Hello World---" 和 " hello_world " 都应得到 "hello-world"。
  先阅读 slug.mjs 与 slug.test.mjs，再修改实现使其满足全部四条规则。
  只允许改 slug.mjs；不要改测试文件，不要新增文件。
  完成后执行 unit 检查，并用文件证据与检查证据分别说明修改与结果。
  注意：现有测试只覆盖了部分规则，检查通过不等于四条规则都成立；
  如果发现测试无法证明某条规则，请在报告里说明，不要笼统声称全部通过。
checks:
  unit:
    argv: [node, "--test", "slug.test.mjs"]
    timeout_seconds: 30
